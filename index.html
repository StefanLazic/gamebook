<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1033">
<meta name="description" content="Whiskerlight — a small fantasy gamebook about a kid searching for a missing cat.">
<title>Whiskerlight — A Gamebook</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐈‍⬛</text></svg>">
</head>
<body>
<div id="stars" aria-hidden="true"></div>

<main id="app">
  <!-- Title screen -->
  <section id="title-screen" class="screen">
    <div class="title-art" aria-hidden="true">🐈‍⬛</div>
    <h1 class="title">Whisker<span>light</span></h1>
    <p class="subtitle">A small fantasy gamebook about a lost cat,<br>a brave kid, and one very odd night.</p>
    <button id="start-btn" class="btn btn-primary">Begin the Search</button>
    <button id="continue-btn" class="btn btn-ghost hidden">Continue</button>
    <p class="credits">Roll dice. Make choices. Find Mochi.</p>
  </section>

  <!-- Game screen -->
  <section id="game-screen" class="screen hidden">
    <header id="hud">
      <div class="stat" title="Courage"><span class="stat-icon">🔥</span><span id="stat-courage">3</span></div>
      <div class="stat" title="Cunning"><span class="stat-icon">🦊</span><span id="stat-cunning">3</span></div>
      <div class="stat" title="Kindness"><span class="stat-icon">💛</span><span id="stat-kindness">3</span></div>
      <div class="stat" title="Health"><span class="stat-icon">❤️</span><span id="stat-health">5</span></div>
      <button id="menu-btn" class="icon-btn" aria-label="Menu">☰</button>
    </header>

    <div id="passage-wrap">
      <article id="passage" tabindex="-1"></article>
      <div id="roll-area" class="hidden"></div>
      <nav id="choices" aria-label="Choices"></nav>
    </div>

    <footer id="pack" aria-label="Items"></footer>
  </section>
</main>

<div id="menu" class="sheet hidden" role="dialog" aria-modal="true" aria-label="Menu">
  <div class="sheet-inner">
    <h2>Menu</h2>
    <button id="menu-resume" class="btn btn-ghost">Resume</button>
    <button id="menu-restart" class="btn btn-ghost">Restart the night</button>
    <p class="menu-note">Progress saves automatically on this device.</p>
  </div>
</div>

<script src="js/story.js"></script>
<script src="js/engine.js"></script>
</body>
</html>
